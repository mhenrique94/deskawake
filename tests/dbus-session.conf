<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Barramento privado dos testes de integração.

  Sem <standard_session_servicedirs/> de propósito: os testes não podem
  auto-ativar serviços reais do host (mate-screensaver no MATE, PowerDevil
  no KDE). Os fakes registram os nomes manualmente, então o mesmo barramento
  funciona nas duas plataformas.
-->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
